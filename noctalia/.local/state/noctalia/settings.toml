config_version = 12

[audio]
enable_overdrive = true
enable_sounds = true

[backdrop]
blur_intensity = 0.21999999508261681
enabled = true
tint_intensity = 0.48999998904764652

[bar]
order = [ "default" ]

    [bar.default]
    background_opacity = 0.74999998323619366
    capsule = true
    capsule_fill = "primary"
    capsule_foreground = "on_primary"
    center = [ "cat", "clock", "widget" ]
    end = [
        "tray",
        "notifications",
        "clipboard",
        "network",
        "bluetooth",
        "volume",
        "brightness",
        "battery",
        "control-center",
        "session"
    ]
    font_family = "JetBrainsMono NF"
    margin_ends = 200
    radius = 33
    start = [ "launcher", "wallpaper", "mpvpaper", "workspaces", "media" ]

[brightness]
enable_ddcutil = true

[calendar]
enabled = true

    [calendar.account.personal_google]
    color = "primary"
    name = "Personal"
    type = "google"

    [calendar.account.work_google]
    color = "secondary"
    name = "Work"
    type = "google"

[control_center.calendar]
show_events_card = false
show_week_numbers = true

[desktop_widgets]
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 32
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[dock]
reserve_space = false
smart_auto_hide = true

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = false
    timeout = 600.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = false
    timeout = 900.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 660.0

[location]
auto_locate = true

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@HDMI-A-1", "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "HDMI-A-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 768.0
    cy = 778.0
    output = "eDP-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[notification]
monitors = [ "eDP-1" ]
position = "top_center"

[plugin_settings."blackbartblues/keymap"]
compositor = "niri"

[plugin_settings."davemhammer/tailscale"]
manager_placement = "attached"
manager_position = "top_center"

[plugin_settings."kenn/keybind-cheatsheet"]
cheatsheet_open_near_click = false
compositor = "niri"
niri_config = "/home/tetrogame/.dotfiles/niri/.config/niri/config.kdl"
show_actions = true

[plugin_settings."noctalia/mpvpaper"]
video_directory = "/home/tetrogame/Videos/Wallpaper"

[plugin_settings."oldirtty/color_picker"]
hyprpicker-lowercase = true
panel_position = "top_center"

[plugin_settings."weinguyen/procmon"]
panel_open_near_click = false
panel_placement = "attached"
panel_position = "top_center"

[plugin_settings."yuuto/arch-updater"]
aur_helper = "yay"
panel_open_near_click = false

[plugins]
enabled = [ "apex077/eyecare" ]

[shell]
app_icon_color = "primary"
font_family = "0xProto Nerd Font"
niri_overview_type_to_launch_enabled = true
popup_shadows = false
screen_time_enabled = true

    [shell.panel]
    launcher_placement = "attached"

    [shell.screenshot]
    directory = "/home/tetrogame/Pictures/Screenshots"

[theme]
builtin = "Catppuccin"
community_palette = "Tokyo Night Storm"
custom_palette = "sayori-ts"
mode = "dark"
source = "custom"
wallpaper_scheme = "soft"

    [theme.templates]
    builtin_ids = [ "ghostty" ]
    community_ids = [ "spicetify", "zen-browser", "telegram", "zellij", "yazi" ]

[wallpaper]
directory = "/home/tetrogame/Pictures/Wallpaper"
transition = [ "fade" ]

    [wallpaper.default]
    path = "/home/tetrogame/Pictures/Wallpaper/Sayori.jpg"

    [wallpaper.last]
    path = "/home/tetrogame/Pictures/Wallpaper/Sayori.jpg"

    [wallpaper.monitors.eDP-1]
    path = "/home/tetrogame/Pictures/Wallpaper/Sayori.jpg"

[widget.cat]
cat_color = "on_primary"
cat_color_mode = "custom"
color = "primary"
icon_color = "primary"
type = "dotnetrob/cat:cat"

[widget.clipboard]
enabled = false

[widget.control-center]
enabled = false

[widget.launcher]
glyph = "brand-ubuntu"

[widget.media]
art_size = 24
hide_when_no_media = true
title_scroll = "on_hover"

[widget.mpvpaper]
type = "noctalia/mpvpaper:mpvpaper"

[widget.network]
show_label = false
show_vpn_label = true

[widget.notifications]
enabled = false

[widget.tray]
drawer = true
hidden = [ "Update-notifier" ]

[widget.widget]
type = "yuuto/arch-updater:widget"

[widget.workspaces]
focused_color = "on_secondary"
hide_when_empty = true
occupied_color = "primary"
show_labels = false